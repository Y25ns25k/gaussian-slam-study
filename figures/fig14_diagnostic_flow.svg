   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b4d" x="32.453308" y="147.314925" transform="rotate(-0 32.453308 147.314925)">1  Spatial / statistics-window diagnostics</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(32.453308 174.044681)">Isolation prediction unsupported; window rule mixed.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(32.453308 188.869759)">Rank correlation 0.92–0.94 weakens a simple window</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(32.453308 203.694838)">explanation; it does not validate deletion quality.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b4d" x="32.453308" y="272.810925" transform="rotate(-0 32.453308 272.810925)">2  Remove the low-opacity tail first</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(32.453308 299.540681)">Random-relative advantage falls 36%, not the set 50%.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(32.453308 314.365759)">Opacity-relative advantage increases. Tail removal also</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(32.453308 329.190837)">changes the population, residuals and amount removed.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b4d" x="32.453308" y="398.306925" transform="rotate(-0 32.453308 398.306925)">3  Compare within opacity bands</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(32.453308 425.036681)">H mean +0.11 dB vs random: B1 mean rule met.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(32.453308 439.861759)">L mean +0.72 dB: B2 +1.0 dB rule not met.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(32.453308 454.686838)">Small pooled H mean includes opposing scene effects.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b4d" x="523.089" y="147.314925" transform="rotate(-0 523.089 147.314925)">Observed composition difference</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(523.089 174.044681)">Opacity ≥ 0.5: SLAM 82.2–84.9%, static 13.5–21.8%.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(523.089 188.869759)">All 94 SLAM submaps; 8 static Taming models.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(523.089 203.694838)">An operational split, not a material-opacity label.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b4d" x="523.089" y="302.690925" transform="rotate(-0 523.089 302.690925)">Candidate explanation — not established</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(523.089 329.420681)">Map composition may affect score usefulness.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(523.089 344.245759)">Its causal contribution is unresolved: protocols,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(523.089 359.070837)">spatial quotas and refinement also differ.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b4d" transform="translate(523.089 373.895916)">B1 does not prove equivalence or no opaque-band gain.</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b4d" x="12.06" y="20.877187" transform="rotate(-0 12.06 20.877187)">Transfer diagnostics: what is observed, and what remains open</text>
  </g>
  <g id="text_12">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b677a" x="12.06" y="44.738203" transform="rotate(-0 12.06 44.738203)">Decision rules constrain the interpretation; an unmet threshold does not establish a zero effect.</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b677a" x="12.06" y="563.840312" transform="rotate(-0 12.06 563.840312)">Conceptual synthesis of retained transfer, tail and opacity-band summaries. Arrows show the reasoning path, not identified causal effects.</text>
  </g>
 </g>

  <g id="text_36">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b677a" x="7.2" y="41.858203" transform="rotate(-0 7.2 41.858203)">Negative: trace costs less. Positive: trace costs more. Black diamonds: mean paired percentage change.</text>

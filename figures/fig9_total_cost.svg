  <g id="text_37">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b677a" transform="translate(7.2 482.639211)">Two 100-frame GT-pose prefixes × three seeds; sources can differ numerically even at the same seed.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5b677a" transform="translate(7.2 494.641945)">Accounting = native mapping wall + common load + compression. Native checkpoint I/O included; not online FPS.</text>
